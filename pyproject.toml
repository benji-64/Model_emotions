[project]
name = "model-emotions"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.1.0",
    "evaluate>=0.4.6",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "onnx>=1.23.2",
    "onnxruntime>=1.31.0",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "torch>=2.14.1",
    "transformers[torch]>=5.18.0",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu132", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true
